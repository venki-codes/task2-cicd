
name: CI/CD Pipeline

# Run workflow whenever code is pushed
# or a pull request is created
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Permissions required for GitHub Actions
permissions:
  contents: read

jobs:

  # ---------------------------
  # JOB 1: TEST APPLICATION
  # ---------------------------

  test:
    name: Test Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Application Tests
        run: npm test

  # ---------------------------
  # JOB 2: BUILD AND PUSH DOCKER
  # ---------------------------

  build:
    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    needs: test

    # Do not publish images from pull requests
    if: github.event_name == 'push'

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/project-docker:latest
            ${{ secrets.DOCKER_USERNAME }}/project-docker:${{ github.sha }}
